<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机选餐</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft Yahei", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f7fb;
      color: #323232;
    }

    .wrapper {
      --input-focus: #2d8cf0;
      --font-color: #323232;
      --font-color-sub: #666;
      --bg-color: #fff;
      --bg-color-alt: #666;
      --main-color: #323232;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }
    /* display: flex; */
    /* flex-direction: column; */
    /* align-items: center; */

    /* switch card */
    .card-switch {
      position: relative;
    }

    .switch {
      transform: translateY(-200px);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      width: 50px;
      height: 20px;
    }

    .card-side::before {
      position: absolute;
      content: '午餐';
      left: -70px;
      top: 0;
      width: 100px;
      text-decoration: underline;
      color: var(--font-color);
      font-weight: 600;
    }

    .card-side::after {
      position: absolute;
      content: '晚餐';
      left: 70px;
      top: 0;
      width: 100px;
      text-decoration: none;
      color: var(--font-color);
      font-weight: 600;
    }

    .toggle {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      box-sizing: border-box;
      border-radius: 5px;
      border: 2px solid var(--main-color);
      box-shadow: 4px 4px var(--main-color);
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--bg-color);
      transition: 0.3s;
    }

    .slider:before {
      box-sizing: border-box;
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      border: 2px solid var(--main-color);
      border-radius: 5px;
      left: -2px;
      bottom: 2px;
      background-color: var(--bg-color);
      box-shadow: 0 3px 0 var(--main-color);
      transition: 0.3s;
    }

    .toggle:checked + .slider {
      background-color: var(--input-focus);
    }

    .toggle:checked + .slider:before {
      transform: translateX(30px);
    }

    .toggle:checked ~ .card-side:before {
      text-decoration: none;
    }

    .toggle:checked ~ .card-side:after {
      text-decoration: underline;
    }

    /* card */
    .flip-card__inner {
      width: 300px;
      height: 350px;
      position: relative;
      background-color: transparent;
      perspective: 1000px;
      text-align: center;
      transition: transform 0.8s;
      transform-style: preserve-3d;
    }
    /* width: 100%;
    height: 100%; */

    .toggle:checked ~ .flip-card__inner {
      transform: rotateY(180deg);
    }

    .toggle:checked ~ .flip-card__front {
      box-shadow: none;
    }

    .flip-card__front,
    .flip-card__back {
      padding: 20px;
      position: absolute;
      display: flex;
      flex-direction: column;
      justify-content: center;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      background: lightgrey;
      gap: 20px;
      border-radius: 5px;
      border: 2px solid var(--main-color);
      box-shadow: 4px 4px var(--main-color);
    }

    .flip-card__back {
      width: 100%;
      transform: rotateY(180deg);
    }

    .flip-card__form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .title {
      margin: 20px 0 20px 0;
      font-size: 25px;
      font-weight: 900;
      text-align: center;
      color: var(--main-color);
    }

    .flip-card__input {
      width: 250px;
      height: 40px;
      border-radius: 5px;
      border: 2px solid var(--main-color);
      background-color: var(--bg-color);
      box-shadow: 4px 4px var(--main-color);
      font-size: 15px;
      font-weight: 600;
      color: var(--font-color);
      padding: 5px 10px;
      text-align: center;
      outline: none;
    }

    .flip-card__input::placeholder {
      color: var(--font-color-sub);
      opacity: 0.8;
    }

    .flip-card__input:focus {
      border: 2px solid var(--input-focus);
    }

    .flip-card__btn {
      margin: 20px 0 20px 0;
      width: 120px;
      height: 40px;
      border-radius: 5px;
      border: 2px solid var(--main-color);
      background-color: var(--bg-color);
      box-shadow: 4px 4px var(--main-color);
      font-size: 17px;
      font-weight: 600;
      color: var(--font-color);
      cursor: pointer;
    }

  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card-switch">
      <label class="switch">
        <input class="toggle" type="checkbox">
        <span class="slider"></span>
        <span class="card-side"></span>

        <div class="flip-card__inner">
          <div class="flip-card__front">
            <div class="title">今天吃什么？</div>
            <form action="" class="flip-card__form">
              <input type="text" value="萨莉亚" class="flip-card__input food-input">

              <button class="flip-card__btn" type="button">开始选餐</button>
            </form>
          </div>

          <div class="flip-card__back">
            <div class="title">今天吃什么？</div>
            <form action="" class="flip-card__form">
              <input type="text" value="兰州拉面" class="flip-card__input food-input">
              <button class="flip-card__btn" type="button">开始选餐</button>
            </form>
          </div>
        </div>
      </label>
    </div>
  </div>

  <script>
    const buttons = document.querySelectorAll('.flip-card__btn');
    const inputs = document.querySelectorAll('.food-input');

    // 在数组中统一维护候选食物
    const foodOptions = [
      '萨莉亚',
      '小谷姐姐',
      '山城佳肴',
      '米范先生',
      '三楼自选',
      '猪脚饭',
      '小碗蒸菜',
      '兰州拉面',
      'KFC',
      '三餐知味',
      '老碗会',
      '煲仔饭',
      '盒马鲜生',
      '饭团',
      '自助旋转小火锅',
    ];

    const rollInterval = 100;   // 轮播间隔 ms
    let rollingTimer = null;
    let activeBtn = null;
    let rolling = false;

    function getFormInput(btn) {
      const form = btn.closest('form');
      return form ? form.querySelector('.food-input') : null;
    }

    function getFoodList() {
      return foodOptions.filter(Boolean);
    }

    function stopRolling() {
      if (rollingTimer) {
        clearInterval(rollingTimer);
        rollingTimer = null;
      }
      if (activeBtn) {
        activeBtn.textContent = '开始选餐';
      }
      rolling = false;
      activeBtn = null;
    }

    function rollFood(btn) {
      const displayInput = getFormInput(btn) || inputs[0];
      const foods = getFoodList();
      if (!foods.length) {
        return;
      }

      // 再次点击同一按钮 -> 停止
      if (rolling && activeBtn === btn) {
        stopRolling();
        return;
      }

      // 有其他按钮在滚动时，先停掉
      if (rolling && activeBtn && activeBtn !== btn) {
        stopRolling();
      }

      activeBtn = btn;
      activeBtn.textContent = '停止';
      rolling = true;

      rollingTimer = setInterval(() => {
        const current = foods[Math.floor(Math.random() * foods.length)];
        if (displayInput) displayInput.value = current;
      }, rollInterval);
    }

    buttons.forEach((btn) => {
      btn.addEventListener('click', () => rollFood(btn));
    });
  </script>
</body>
</html>
